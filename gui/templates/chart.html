<!DOCTYPE html>
<html>
<head>
    <title>Q-xApp Simulation</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            background-color: #ffffff;
            color: #333;
            font-family: 'Roboto', sans-serif;
            overflow: auto;
        }
        #main-container {
            width: 100%; min-height: 100%;
            display: flex; flex-direction: column;
            padding: 10px; gap: 8px;
        }
        #header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px 20px;
            border-bottom: 2px solid #8B0000;
        }
        #header-left { display: flex; align-items: center; gap: 15px; }
        #header-left .logo-text {
            font-size: 14px; font-weight: bold; color: #8B0000;
            line-height: 1.2;
        }
        #header-center { text-align: center; flex: 1; }
        #header-center h1 { font-size: 24px; font-weight: 700; color: #333; }
        #header-center .header-buttons {
            margin-top: 5px; display: flex; justify-content: center; gap: 10px;
        }
        .header-btn {
            background: #8B0000; color: white;
            padding: 6px 16px; border: none; border-radius: 4px;
            cursor: pointer; font-size: 12px; font-weight: 600;
        }
        .header-btn:hover { background: #a00000; }
        #header-right { display: flex; align-items: center; gap: 15px; }
        #header-right .logo-text {
            font-size: 12px; font-weight: bold; color: #003366;
            text-align: right; line-height: 1.2;
        }
        #form-container {
            display: none; background: #f5f5f5;
            border: 1px solid #ddd; border-radius: 8px;
            padding: 15px; margin: 5px 0;
        }
        #simulationForm {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 12px; font-size: 13px;
        }
        #simulationForm label { font-weight: 600; margin-bottom: 3px; color: #333; }
        #simulationForm input, #simulationForm select {
            padding: 6px; border-radius: 4px; border: 1px solid #ccc;
            background: #fff; color: #333; width: 100%;
        }
        #simulationForm button {
            padding: 8px; border-radius: 4px; border: none;
            background: #8B0000; color: white; cursor: pointer; font-weight: bold;
        }
        #simulationForm button:disabled { background: #ccc; color: #999; cursor: not-allowed; }
        #frameContainer {
            display: block; background: #f5f5f5;
            border: 1px solid #ddd; border-radius: 8px;
            padding: 15px; margin: 5px 0;
        }
        #content-area {
            display: flex; gap: 10px; align-items: flex-start;
        }
        #grid-panel {
            width: 580px; display: flex; flex-direction: column;
            border: 1px solid #ddd; border-radius: 8px;
            padding: 10px; background: #fff; flex-shrink: 0;
        }
        #grid-panel h3 { text-align: center; font-size: 16px; color: #333; margin-bottom: 5px; }
        #grid-chart-container { position: relative; width: 100%; margin: 0 auto; }
        #grid-chart-container canvas { }
        .grid-legend {
            display: flex; justify-content: center; gap: 15px;
            padding: 5px; font-size: 12px; flex-wrap: wrap;
        }
        .grid-legend-item { display: flex; align-items: center; gap: 4px; }
        .grid-legend-color { width: 14px; height: 14px; display: inline-block; }
        #kpi-panel {
            flex: 1; display: flex; flex-direction: column; gap: 8px;
        }
        .kpi-row { display: flex; gap: 8px; flex: 1; }
        .kpi-chart-box {
            flex: 1; border: 1px solid #ddd; border-radius: 8px;
            padding: 8px; background: #fff;
            position: relative; min-height: 0; max-height: 280px;
        }
        .kpi-chart-box canvas { width: 100% !important; height: 100% !important; }


        .status-row {
            display: flex; justify-content: center; align-items: center;
            gap: 10px; font-size: 13px;
        }
    </style>
</head>
<body>
<div id="main-container">
    <div id="header">
        <div id="header-left">
            <img src="/static/korea_univ.png" alt="Korea University" style="height: 50px;">
        </div>
        <div id="header-center">
            <h1>Q-xApp Simulation</h1>
            <div class="header-buttons">


            </div>
        </div>
        <div id="header-right">
            <img src="/static/lics_logo.png" alt="LICS" style="height: 45px;">
        </div>
    </div>

    <div id="form-container">
        <form id="simulationForm">
            <div style="display:none">
                <div style="display: flex; flex-direction: column;">
                    <div style="display: flex; align-items: center; margin-bottom: 8px;">
                        <label for="flexric">Connect to FlexRIC:</label>
                        <input type="checkbox" id="flexric" name="flexric" value="true" style="transform: scale(1.3); margin-left: 8px;">
                    </div>
                    <div style="display: flex; align-items: center;">
                        <label for="e2TermIp" style="margin-right: 8px;">e2TermIp:</label>
                        <input type="text" id="e2TermIp" name="e2TermIp" value="127.0.0.1" disabled style="background-color: #eee;">
                    </div>
                </div>
            </div>
            <div style="display:none"><label for="hoSinrDifference">hoSinrDifference (dB):</label><input type="number" id="hoSinrDifference" name="hoSinrDifference" value="3"></div>
            <div style="display:none"><label for="indicationPeriodicity">indicationPeriodicity (s):</label><input type="number" id="indicationPeriodicity" name="indicationPeriodicity" value="1"></div>
            <div style="display:none"><label for="simTime">simTime (s):</label><input type="number" id="simTime" name="simTime" value="1800"></div>
            <div style="display:none"><label for="KPM_E2functionID">KPM_E2functionID:</label><input type="number" id="KPM_E2functionID" name="KPM_E2functionID" value="2"></div>
            <div style="display:none"><label for="RC_E2functionID">RC_E2functionID:</label><input type="number" id="RC_E2functionID" name="RC_E2functionID" value="3"></div>
            <div><label for="N_MmWaveEnbNodes">N_MmWaveEnbNodes:</label><input type="number" id="N_MmWaveEnbNodes" name="N_MmWaveEnbNodes" value="3"></div>
            <div><label for="N_Ues">N_Ues:</label><input type="number" id="N_Ues" name="N_Ues" value="4"></div>
            <div><label for="CenterFrequency">CenterFrequency (Hz):</label><input type="number" id="CenterFrequency" name="CenterFrequency" value="3.5e9"></div>
            <div><label for="Bandwidth">Bandwidth (Hz):</label><input type="number" id="Bandwidth" name="Bandwidth" value="100e6"></div>
            <div><label for="IntersideDistanceUEs">IntersideDistanceUEs (m):</label><input type="number" id="IntersideDistanceUEs" name="IntersideDistanceUEs" value="150"></div>
            <div><label for="IntersideDistanceCells">IntersideDistanceCells (m):</label><input type="number" id="IntersideDistanceCells" name="IntersideDistanceCells" value="150"></div>
            <div style="display:none">
                <label for="scenario">Scenario:</label>
                <select id="scenario" name="scenario" onchange="setFlags()"></select>
                <div style="display:none; align-items: center; margin-top: 4px;">
                    <label for="flags">Flags:</label>
                    <input type="checkbox" id="flags" name="flags" value="true" style="transform: scale(1.3); margin-left: 8px;">
                </div>
            </div>
            <div><label for="scenario-mode">Use Case:</label>
                <select id="scenario-mode" onchange="switchScenario(this.value)">
                    <option value="ts">Traffic Steering</option>
                    <option value="nes">Network Energy Saving</option>
                    <option value="qos">QoS-based Resource Allocation</option>
                </select>
            </div>
            <div id="a1-policy-panel" style="display:flex; flex-direction:row; align-items:center; gap:8px;">
                <label>Max UE per Cell:</label>
                <select id="max-ue-per-cell" onchange="updateA1Policy()">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>
            <div id="sleep-oru-panel" style="display:none; flex-direction:row; align-items:center; gap:8px;">
                <label>Sleep O-RU:</label>
                <label style="margin-left:8px"><input type="radio" name="sleep-oru" value="2" onchange="updateSleepConfig()"> O-RU 1</label>
                <label style="margin-left:8px"><input type="radio" name="sleep-oru" value="3" onchange="updateSleepConfig()"> O-RU 2</label>
                <label style="margin-left:8px"><input type="radio" name="sleep-oru" value="4" onchange="updateSleepConfig()" checked> O-RU 3</label>
            </div>
            <div id="qos-config-panel" style="display:none; flex-direction:row; align-items:center; gap:8px;">
                <label>UE Priority:</label>
                <label>UE1:<select id="qos-ue-1" onchange="updateQosConfig()"><option value="high" selected>High</option><option value="low">Low</option></select></label>
                <label>UE2:<select id="qos-ue-2" onchange="updateQosConfig()"><option value="high" selected>High</option><option value="low">Low</option></select></label>
                <label>UE3:<select id="qos-ue-3" onchange="updateQosConfig()"><option value="high">High</option><option value="low" selected>Low</option></select></label>
                <label>UE4:<select id="qos-ue-4" onchange="updateQosConfig()"><option value="high">High</option><option value="low" selected>Low</option></select></label>
            </div>
            <div style="grid-column: 1 / -1; display: flex; gap: 8px;">
                <button type="button" onclick="sendForm('/start_simulation')" id="start_button">Start</button>
                <button type="button" onclick="stopSim('/stop_simulation')" id="stop_button" disabled>Stop</button>
                <button type="button" onclick="resetSim('/reset_simulation')" id="reset_button">Reset</button>
            </div>
            <div class="status-row" style="display:none">
                <label>Status:</label>
                <label id="status_label">off</label>
                <label id="label_between_status_and_simid"></label>
                <label id="simid_label" style="color: #8B0000;"></label>
            </div>
            <div><label id="warning_label" style="color: red;"></label></div>
        </form>
    </div>

    <div id="frameContainer" style="display:none"></div>


    <div id="sim-info-bar" style="display:flex; flex-direction:column; padding:8px 20px; font-size:13px; color:#333; border-bottom:2px solid #8B0000; gap:6px;">
        <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
            <span style="font-weight:700; color:#333;">Network Settings</span>
            <span style="color:#999;">|</span>
            <span>O-RU: 3 (mmWave)</span>
            <span>UE: 4</span>
            <span>Bandwidth: 100 MHz</span>
            <span>Center Freq: 3.5 GHz</span>
            <span>ISD (UE): 150 m</span>
            <span>ISD (Cell): 150 m</span>
            <span id="sim-timer" style="margin-left:auto; font-weight:600; color:#8B0000;"></span>
        </div>
        <div style="display:flex; align-items:center; gap:15px; flex-wrap:wrap;">
            <span style="font-weight:700; color:white; background:#8B0000; padding:3px 10px; border-radius:4px;">A1 Policy Manager</span>
            <label style="font-weight:600;">Use Case:
                <select id="scenario-mode-bar" onchange="switchScenario(this.value)" style="font-size:13px; padding:3px 6px; margin-left:4px;">
                    <option value="ts">Traffic Steering</option>
                    <option value="nes">Network Energy Saving</option>
                    <option value="qos">QoS-based Resource Allocation</option>
                </select>
            </label>
            <label id="ts-maxue-bar">Max UE/Cell: <select id="maxue-select" onchange="updateA1Policy()" style="font-size:12px;"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></label>
            <span id="sleep-oru-bar" style="display:none;">
                Sleep O-RU:
                <label><input type="radio" name="sleep-oru-bar" value="2" onchange="updateSleepConfig()"> O-RU 1</label>
                <label><input type="radio" name="sleep-oru-bar" value="3" onchange="updateSleepConfig()"> O-RU 2</label>
                <label><input type="radio" name="sleep-oru-bar" value="4" onchange="updateSleepConfig()" checked> O-RU 3</label>
            </span>
            <span id="qos-config-bar" style="display:none;">
                UE Priority:
                <label>UE1:<select id="qos-ue-bar-1" onchange="updateQosConfig()" style="font-size:12px;"><option value="high" selected>High</option><option value="low">Low</option></select></label>
                <label>UE2:<select id="qos-ue-bar-2" onchange="updateQosConfig()" style="font-size:12px;"><option value="high" selected>High</option><option value="low">Low</option></select></label>
                <label>UE3:<select id="qos-ue-bar-3" onchange="updateQosConfig()" style="font-size:12px;"><option value="high">High</option><option value="low" selected>Low</option></select></label>
                <label>UE4:<select id="qos-ue-bar-4" onchange="updateQosConfig()" style="font-size:12px;"><option value="high">High</option><option value="low" selected>Low</option></select></label>
            </span>
        </div>
    </div>
    <div id="content-area">
        <div id="grid-panel">
            <div id="grid-chart-container">
                <canvas id="myChart"></canvas>
            </div>
            <div class="grid-legend">
                <div class="grid-legend-item">
                    <span class="grid-legend-color" style="background: #33aa33; clip-path: polygon(50% 0%, 0% 100%, 100% 100%);"></span>
                    <span>O-RU 1</span>
                </div>
                <div class="grid-legend-item">
                    <span class="grid-legend-color" style="background: #9933cc; clip-path: polygon(50% 0%, 0% 100%, 100% 100%);"></span>
                    <span>O-RU 2</span>
                </div>
                <div class="grid-legend-item">
                    <span class="grid-legend-color" style="background: #cc3333; clip-path: polygon(50% 0%, 0% 100%, 100% 100%);"></span>
                    <span>O-RU 3</span>
                </div>
                <div class="grid-legend-item">
                    <span class="grid-legend-color" style="background: #999; border-radius: 50%; width: 10px; height: 10px;"></span>
                    <span>UE (color = connected O-RU)</span>
                </div>

            </div>
        </div>

        <div id="kpi-panel">
            <div class="kpi-row">
                <div class="kpi-chart-box"><canvas id="sinr-chart"></canvas></div>
            </div>
            <div class="kpi-row">
                <div class="kpi-chart-box"><canvas id="energy-chart"></canvas></div>
                <div class="kpi-chart-box"><canvas id="retx-chart"></canvas></div>
            </div>
        </div>


    </div>


</div>

<script>
    const host_ns3 = "{{ host_ns3 }}";
    const DEFAULT_SCENARIO = 'scratch/scenario-zero-with_parallel_loging.cc';
    const DEFAULT_SIMULATION_PARAMS = { flexric: 'true', flags: 'true', scenario: DEFAULT_SCENARIO };
    const cellColors = { 1: '#3366cc', 2: '#33aa33', 3: '#9933cc', 4: '#cc3333' };
    const ueColors = ['#cc3333', '#33aa33', '#9933cc', '#3366cc'];
    /* Fixed O-RU positions: triangular around center=(250,250), ISD=150 */
    const fixedCellPos = { 2: {x:400,y:250}, 3: {x:175,y:380}, 4: {x:175,y:120} };

    function toggleA1Manager() {
        const form = document.getElementById('form-container');
        const shouldShow = form.style.display === 'none' || form.style.display === '';
        form.style.display = shouldShow ? 'block' : 'none';
    }

    var currentScenario = 'ts';
    function switchScenario(mode) {
        currentScenario = mode;
        var headerSelect = document.getElementById("scenario-mode-header");
        if (headerSelect) headerSelect.value = mode;
        var barSelect = document.getElementById("scenario-mode-bar");
        if (barSelect) barSelect.value = mode;
        var tsMaxUe = document.getElementById("ts-maxue-bar");
        if (tsMaxUe) tsMaxUe.style.display = (mode === 'ts') ? 'inline' : 'none';
        var sleepBar = document.getElementById("sleep-oru-bar");
        if (sleepBar) sleepBar.style.display = (mode === 'nes') ? 'inline' : 'none';
        var qosBar = document.getElementById("qos-config-bar");
        if (qosBar) qosBar.style.display = (mode === 'qos') ? 'inline' : 'none';
        var sleepPanel = document.getElementById('sleep-oru-panel');
        if (sleepPanel) sleepPanel.style.display = 'none';
        var a1Panel = document.getElementById('a1-policy-panel');
        if (a1Panel) a1Panel.style.display = 'none';
        var qosPanel = document.getElementById('qos-config-panel');
        if (qosPanel) qosPanel.style.display = 'none';
        fetch("/switch_usecase", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({mode: mode})
        }).then(function(r) { return r.json(); })
        .then(function(d) { console.log("Switched to:", d.mode); });
        if (mode === 'nes') updateSleepConfig();
        if (mode === 'qos') updateQosConfig();
        var throughputTitle = (mode === 'nes') ? 'Throughput (NES)' : (mode === 'qos') ? 'Throughput (QoS-RA)' : 'Throughput';
        sinrChart.options.plugins.title.text = throughputTitle;
        sinrChart.update();
    }

    function updateA1Policy() {
        var val = (document.getElementById('maxue-select') || document.getElementById('max-ue-per-cell')).value;
        document.getElementById('max-ue-per-cell').value = val;
        document.getElementById('maxue-select').value = val;
        fetch('/set_a1_policy', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({max_ue_per_cell: parseInt(val)})
        });
    }

    function updateSleepConfig() {
        var selected = document.querySelector('input[name="sleep-oru-bar"]:checked') || document.querySelector('input[name="sleep-oru"]:checked');
        var sleepCells = selected ? [parseInt(selected.value)] : [];
        fetch('/set_sleep_config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({sleep_cells: sleepCells})
        });
        myChart.update();
    }

    function updateQosConfig() {
        var weights = [];
        for (var i = 1; i <= 4; i++) {
            var sel = document.getElementById('qos-ue-bar-' + i) || document.getElementById('qos-ue-' + i);
            weights.push(sel.value === 'high' ? 2.0 : 1.0);
        }
        fetch('/set_qos_config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({weights: weights})
        });
    }

    document.getElementById('flexric').addEventListener('change', function() {
        var e2f = document.getElementById('e2TermIp');
        if (this.checked) { e2f.disabled = false; e2f.style.backgroundColor = ''; }
        else { e2f.disabled = true; e2f.value = '127.0.0.1'; e2f.style.backgroundColor = '#eee'; }
    });

    // Background map plugin
    var mapImg = new Image();
    mapImg.src = '/static/univmap.png';
    var bgMapPlugin = {
        id: 'bgMap',
        beforeDraw: function(chart) {
            if (chart.canvas.id !== 'myChart') return;
            if (!mapImg.complete) return;
            var ca = chart.chartArea;
            if (!ca) return;
            chart.ctx.save();
            chart.ctx.globalAlpha = 1.0;
            chart.ctx.drawImage(mapImg, ca.left, ca.top, ca.right - ca.left, ca.bottom - ca.top);
            chart.ctx.restore();
        }
    };

    // Simulation Grid Chart
    var ctx = document.getElementById('myChart').getContext('2d');
    var myChart = new Chart(ctx, {
        type: 'scatter',
        data: {
            datasets: [
                {
                    label: 'UEs', data: [], backgroundColor: [],
                    borderWidth: 1, pointRadius: 6, pointStyle: 'circle',
                    datalabels: {
                        align: 'top', color: '#333', font: { size: 10 },
                        formatter: function(value) {
                            var label = 'UE ' + (value.ue_id || '');
                            if (currentScenario === 'qos' && qxappData && qxappData.drb_assignment) {
                                var idx = (value.ue_id || 1) - 1;
                                var da = qxappData.drb_assignment.find(function(x){ return x.ue === idx; });
                                if (da && da.drb > 0) label += ' (d' + da.drb + ':' + da.type + ')';
                            } else if (currentScenario === 'qos' && qxappData && qxappData.qos_weights) {
                                var idx2 = (value.ue_id || 1) - 1;
                                var w = qxappData.qos_weights[idx2];
                                label += w >= 2.0 ? ' (H)' : ' (L)';
                            }
                            return label;
                        }, offset: 6
                    }
                },
                {
                    label: 'Cells', data: [], backgroundColor: [],
                    borderWidth: 1, pointRadius: 18, pointStyle: 'triangle',
                    datalabels: {
                        align: 'top', color: '#8B0000', font: { size: 10, weight: 'bold' },
                        formatter: function(value) {
                            return value.bs_label || 'O-RU';
                        }, offset: 12
                    }
                }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: true, aspectRatio: 1,
            scales: {
                x: { type: 'linear', position: 'bottom', min: 0, max: 500,
                    grid: { color: 'rgba(0,0,0,0.1)' }, ticks: { color: '#333' }
                },
                y: { min: 0, max: 500,
                    grid: { color: 'rgba(0,0,0,0.1)' }, ticks: { color: '#333' }
                }
            },
            plugins: {
                legend: { display: false },
                title: { display: true, text: 'Simulation Grid', color: '#333', font: { size: 16 } },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const dp = context.dataset.data[context.dataIndex];
                            let label = context.dataset.label;
                            if (dp.ue_id) label += ' ID:' + dp.ue_id;
                            if (dp.cell_id) label += ' ID:' + dp.cell_id;
                            label += ' (' + dp.x.toFixed(1) + ', ' + dp.y.toFixed(1) + ')';
                            if (dp.type) label += ' [' + dp.type + ']';
                            return label;
                        }
                    }
                },
                datalabels: { display: true }
            }
        },
        plugins: [bgMapPlugin, ChartDataLabels]
    });

    // KPI chart factory
    function createLineChart(canvasId, title, yLabel, datasets) {
        var c = document.getElementById(canvasId).getContext('2d');
        return new Chart(c, {
            type: 'line',
            data: { labels: Array.from({length: 51}, function(_, i) { return -50 + i; }), datasets: datasets || [] },
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                scales: {
                    x: {
                        title: { display: true, text: 'Timeline', color: '#666', font: { size: 11 } },
                        grid: { color: 'rgba(0,0,0,0.08)' }, ticks: { color: '#666', font: { size: 9 } }
                    },
                    y: {
                        title: { display: true, text: yLabel, color: '#666', font: { size: 11 } },
                        beginAtZero: true,
                        grid: { color: 'rgba(0,0,0,0.08)' }, ticks: { color: '#666', font: { size: 9 } }
                    }
                },
                plugins: {
                    legend: { display: true, position: 'top', labels: { color: '#333', font: { size: 10 }, usePointStyle: true, boxWidth: 8 } },
                    title: { display: true, text: title, color: '#333', font: { size: 14 } },
                    datalabels: { display: false }
                }
            },
            plugins: [ChartDataLabels]
        });
    }

    var sinrChart = createLineChart('sinr-chart', 'Throughput', 'Mbps', [
        { label: 'UE 1', data: [], borderColor: ueColors[0], borderWidth: 2, fill: false, pointRadius: 0 },
        { label: 'UE 2', data: [], borderColor: ueColors[1], borderWidth: 2, fill: false, pointRadius: 0 },
        { label: 'UE 3', data: [], borderColor: ueColors[2], borderWidth: 2, fill: false, pointRadius: 0 },
        { label: 'UE 4', data: [], borderColor: ueColors[3], borderWidth: 2, fill: false, pointRadius: 0 }
    ]);
    var energyChart = createLineChart('energy-chart', 'Cell Power (W)', 'Power (W)', [
        { label: 'O-RU 1', data: [], borderColor: cellColors[2], borderWidth: 2, fill: false, pointRadius: 0 },
        { label: 'O-RU 2', data: [], borderColor: cellColors[3], borderWidth: 2, fill: false, pointRadius: 0 },
        { label: 'O-RU 3', data: [], borderColor: cellColors[4], borderWidth: 2, fill: false, pointRadius: 0 }
    ]);
    var retxChart = createLineChart('retx-chart', 'RETX', 'Error Count', [
        { label: 'UE 1', data: [], borderColor: ueColors[0], borderWidth: 2, fill: false, pointRadius: 0 },
        { label: 'UE 2', data: [], borderColor: ueColors[1], borderWidth: 2, fill: false, pointRadius: 0 },
        { label: 'UE 3', data: [], borderColor: ueColors[2], borderWidth: 2, fill: false, pointRadius: 0 },
        { label: 'UE 4', data: [], borderColor: ueColors[3], borderWidth: 2, fill: false, pointRadius: 0 }
    ]);

    // Bar chart

    // History
    var sinrHistory = { 1: [], 2: [], 3: [], 4: [] };
    var energyHistory = { 2: [], 3: [], 4: [] };
    var retxHistory = { 1: [], 2: [], 3: [], 4: [] };
    var MAX_HISTORY = 51;

    function pushHistory(histObj, id, value) {
        if (!histObj[id]) histObj[id] = [];
        histObj[id].push(value);
        if (histObj[id].length > MAX_HISTORY) histObj[id].shift();
    }

    function pushDeltaHistory(histObj, id, value) {
        if (!histObj[id]) histObj[id] = [];
        var prev = histObj[id].length ? histObj[id][histObj[id].length - 1].__raw : null;
        var delta = prev === null ? 0 : Math.max(0, value - prev);
        histObj[id].push({ value: delta, __raw: value });
        if (histObj[id].length > MAX_HISTORY) histObj[id].shift();
    }

    var qxappData = null; /* Q-xApp allocation result */

    function fetchData() {
        /* Fetch both InfluxDB data and Q-xApp result in parallel */
        Promise.all([
            fetch('/refresh-data').then(function(r) { return r.json(); }),
            fetch('/qxapp-result').then(function(r) { return r.json(); }).catch(function() { return null; })
        ]).then(function(results) {
            var data = results[0];
            qxappData = results[1];
            if (!data) return;
            updateGrid(data);
            updateKPIs(data);
            /* Update sim timer */
            var timerEl = document.getElementById('sim-timer');
            if (timerEl) {
                if (!window._simStartTime && data.ues && data.ues.length > 0 && data.ues[0].x_position) {
                    window._simStartTime = Date.now() / 1000;
                }
                if (window._simStartTime) {
                    var simMaxSec = 1800;
                    var elapsed = Math.floor(Date.now() / 1000 - window._simStartTime);
                    var remain = Math.max(0, simMaxSec - elapsed);
                    var mm = Math.floor(remain / 60);
                    var ss = remain % 60;
                    timerEl.textContent = 'Remaining Sim. Time: ' + mm + 'm ' + (ss < 10 ? '0' : '') + ss + 's';
                    if (remain <= 0) {
                        timerEl.style.color = '#cc0000';
                        timerEl.textContent = 'Simulation ended';
                        if (!window._simEnded) {
                            window._simEnded = true;
                            fetch('/kill_simulation', {method: 'POST'}).catch(function(){});
                        }
                    }
                }
            }
        }).catch(function(e) { console.log('Fetch error:', e); });
    }

    function updateGrid(data) {
        var ueData = [], ueBg = [], cellData = [], cellBg = [];

        /* Build Q-xApp assignment map: ue_id -> cell_id */
        var qxappAssign = {};
        var oruToCellId = {'O-RU 1': 2, 'O-RU 2': 3, 'O-RU 3': 4};
        /* Cell 5 no longer exists (no co-location) */
        if (qxappData && qxappData.assignment) {
            qxappData.assignment.forEach(function(a) {
                if (a.oru === 'unassigned') {
                    qxappAssign[a.ue + 1] = -1;
                } else {
                    var cellId = oruToCellId[a.oru] || 2;
                    qxappAssign[a.ue + 1] = cellId;
                }
            });
        }

        if (data.ues) {
            data.ues.forEach(function(ue, i) {
                var ux = ue.x_position || ue.x || 0;
                var uy = ue.y_position || ue.y || 0;
                var uid = ue.ue_id || i+1;

                /* UE 4 has no position: place near center */
                if (ux == 0 && uy == 0) { ux = 250 + uid * 20; uy = 250 + uid * 15; }

                /* Use Q-xApp assignment if available, otherwise ns-3 data */
                var connCell = (uid in qxappAssign) ? qxappAssign[uid] : (ue.MMWave_Cell || 0);
                if (connCell === 1) connCell = 2;

                var isUnassigned = (connCell === -1);
                ueData.push({ x: ux, y: uy, ue_id: uid, type: isUnassigned ? 'unassigned' : (ue.type || ''), MMWave_Cell: connCell });
                ueBg.push(isUnassigned ? '#ccc' : (cellColors[connCell] || '#999'));
            });
        }
        /* Always show O-RUs at fixed positions — gray if sleeping */
        var sleepList = (qxappData && qxappData.sleep_cells) ? qxappData.sleep_cells : [];
        [2, 3, 4].forEach(function(cid) {
            var fp = fixedCellPos[cid];
            var isSleep = (sleepList.indexOf(cid) >= 0);
            var bsLabel = 'O-RU ' + (cid - 1) + (isSleep ? ' (sleep)' : '');
            cellData.push({ x: fp.x, y: fp.y, cell_id: cid, bs_label: bsLabel, type: 'mmwave' });
            cellBg.push(isSleep ? '#bbb' : (cellColors[cid] || '#999'));
        });
        myChart.data.datasets[0].data = ueData;
        myChart.data.datasets[0].backgroundColor = ueBg;
        myChart.data.datasets[1].data = cellData;
        myChart.data.datasets[1].backgroundColor = cellBg;
        myChart.update();
    }

    function updateKPIs(data) {
        if (data.ues) {
            data.ues.forEach(function(ue, i) {
                var uid = ue.ue_id || (i + 1);
                pushHistory(sinrHistory, uid, (ue.TP_Combined_PDCP_ENDC_kbps || 0) / 1000.0);
                pushDeltaHistory(retxHistory, uid, ue.ErrTotalNbrDl || 0);
            });
        }
        if (data.cells) {
            data.cells.forEach(function(cell, i) {
                var cid = cell.cell_id || (i + 1);
                if (cid >= 2 && cid <= 4) {
                    var cellEnergy = (qxappData && qxappData.cell_energy && qxappData.cell_energy[cid]) ? qxappData.cell_energy[cid] : 0;
                    pushHistory(energyHistory, cid, cellEnergy);
                }
            });
        }

        // Update SINR chart (per UE)
        [1,2,3,4].forEach(function(uid, idx) {
            sinrChart.data.datasets[idx].data = sinrHistory[uid] || [];
            retxChart.data.datasets[idx].data = (retxHistory[uid] || []).map(function(point) { return typeof point === 'object' ? point.value : point; });
        });

        // Update PRB chart (per Cell, mmWave only)
        [2,3,4].forEach(function(cid, idx) {
            energyChart.data.datasets[idx].data = energyHistory[cid] || [];
        });

        var maxLen = Math.max.apply(null, Object.keys(sinrHistory).map(function(k) { return sinrHistory[k].length; }).concat([1]));
        var labels = Array.from({length: maxLen}, function(_, i) { return i; });
        sinrChart.data.labels = labels; sinrChart.update();
        energyChart.data.labels = labels; energyChart.update();
        retxChart.data.labels = labels; retxChart.update();
    }


    async function sendForm(url) {
        var form = document.getElementById('simulationForm');
        var formData = new FormData(form);
        var params = Object.assign({}, DEFAULT_SIMULATION_PARAMS);
        formData.forEach(function(v, k) { params[k] = v; });
        if (!params.scenario || params.scenario.indexOf('scenario-zero-with_parallel_loging') < 0) {
            var sel = document.getElementById('scenario');
            for (var si = 0; si < sel.options.length; si++) {
                if (sel.options[si].value.indexOf('scenario-zero-with_parallel_loging') >= 0) {
                    sel.selectedIndex = si; params.scenario = sel.options[si].value; break;
                }
            }
            if (!params.scenario || params.scenario.indexOf('scenario-zero-with_parallel_loging') < 0)
                params.scenario = 'scratch/scenario-zero-with_parallel_loging.cc';
        }
        params.flags = 'true';
        document.getElementById('start_button').disabled = true;
        document.getElementById('stop_button').disabled = false;
        document.getElementById('status_label').textContent = 'starting...';
        try {
            var response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(params)
            });
            var result = await response.json();
            document.getElementById('status_label').textContent = 'on';
            if (result.simid) document.getElementById('simid_label').textContent = 'ID: ' + result.simid;
        } catch (e) {
            document.getElementById('status_label').textContent = 'error';
            document.getElementById('start_button').disabled = false;
        }
    }

    async function stopSim(url) {
        try {
            await fetch(url, { method: 'POST' });
            document.getElementById('status_label').textContent = 'off';
            document.getElementById('start_button').disabled = false;
            document.getElementById('stop_button').disabled = true;
        } catch (e) { console.log('Stop error:', e); }
    }

    async function resetSim(url) {
        try {
            await fetch(url, { method: 'POST' });
            document.getElementById('status_label').textContent = 'off';
            document.getElementById('start_button').disabled = false;
            document.getElementById('stop_button').disabled = true;
            [sinrHistory, energyHistory, retxHistory].forEach(function(h) {
                Object.keys(h).forEach(function(k) { h[k] = []; });
            });
        } catch (e) { console.log('Reset error:', e); }
    }

    function setFlags() {}

    async function fetchScenarios() {
        try {
            var response = await fetch('/scenarios');
            var scenarios = await response.json();
            var select = document.getElementById('scenario');
            var values = Array.isArray(scenarios) ? scenarios : Object.values(scenarios);
            values.forEach(function(s) {
                var opt = document.createElement('option');
                opt.value = s; opt.textContent = s.replace('scratch/', '').replace('.cc', '');
                if (s.indexOf('scenario-zero-with_parallel_loging') >= 0) opt.selected = true;
                select.appendChild(opt);
            });
        } catch (e) { console.log('Scenario fetch error:', e); }
    }

    fetchScenarios();
    /* Load current use case mode */
    fetch("/current_usecase").then(function(r) { return r.json(); }).then(function(d) {
        var headerSelect = document.getElementById("scenario-mode-header");
        if (headerSelect) headerSelect.value = d.mode;
        var barSelect = document.getElementById("scenario-mode-bar");
        if (barSelect) barSelect.value = d.mode;
        var formSelect = document.getElementById("scenario-mode");
        if (formSelect) formSelect.value = d.mode;
        currentScenario = d.mode;
        switchScenario(d.mode);
    });
    setInterval(fetchData, 1000);
</script>
</body>
