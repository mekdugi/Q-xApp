name: ci
# Minimum CI (remediation R5.5): syntax, quick solver validation, GUI unit
# tests. Long-running validation (v5 stage A/B, tuning, the one-shot 1,060
# holdout, Aer benchmarks) is NOT run in CI — see docs/validation_matrix.json
# for the recorded reports and exact local commands.

on:
  push:
  pull_request:

jobs:
  solver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked solver environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r install/solver_requirements.txt
          python -m pip check
      - name: Syntax compile (all solver + harness sources)
        run: |
          python -m py_compile \
            flexric/xApp/dqna_ts.py flexric/xApp/dqna_42.py \
            flexric/xApp/dqna_qos.py flexric/xApp/dqna_modes.py \
            flexric/xApp/dqna_constraints.py \
            scripts/validate_dqna_ts.py scripts/validate_cli.py \
            scripts/validate_backend_default.py \
            scripts/v5a_legacy_golden_check.py \
            scripts/validate_nes_suite.py scripts/validate_qos_exhaustive.py \
            scripts/validate_aer_ab.py scripts/benchmark_aer.py \
            scripts/aer_strict_probe.py scripts/v5_holdout_run.py \
            gui/main.py gui/src/http/data_controller.py \
            gui/src/copy_sim_data_pusher.py
      - name: Canonical backend default (reference) + opt-in Aer
        # qiskit-aer==0.15.1 is already in the lock file installed above
        run: python scripts/validate_backend_default.py
      - name: Legacy v4.1 golden regression
        run: python scripts/v5a_legacy_golden_check.py
      - name: NES 306-case deterministic suite
        run: python scripts/validate_nes_suite.py
      - name: QoS exhaustive {0,1,10}^8 suite
        run: python scripts/validate_qos_exhaustive.py
      - name: verify.sh rejects unknown tiers (exit 2, before any check)
        run: |
          set +e
          bash verify.sh nonsense
          rc=$?
          set -e
          test "$rc" -eq 2
      - name: GUI local asset existence + file-magic/extension consistency
        run: python scripts/check_gui_assets.py

  gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GUI dependencies (test deps pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gui/requirements.txt pytest==9.1.1
      - name: GUI unit / security / pusher fault tests
        env:
          HOST_DATA_DIR: /tmp/qxapp_gui_test
          NS3_HOST: 127.0.0.1
        run: python -m pytest gui/tests -q
