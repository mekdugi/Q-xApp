name: public-core-ci

on:
  push:
  pull_request:

jobs:
  solver-and-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: install/solver_requirements.txt
      - name: Install locked solver environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r install/solver_requirements.txt
          python -m pip check
      - name: Verify public solver, manifests, and artifacts
        env:
          PY: python
          QXAPP_REPORT_DIR: ${{ runner.temp }}/qxapp-reports
        run: bash verify.sh solver

  gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: gui/requirements.txt
      - name: Install GUI test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gui/requirements.txt pytest==9.1.1
          python -m pip check
      - name: Verify current GUI
        env:
          GUI_PY: python
        run: bash verify.sh gui
